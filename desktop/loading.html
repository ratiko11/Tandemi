<!doctype html><html><head><meta charset="utf-8"><title>Tandemi</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#EDE8FF;color:#17142B;font:600 15px "Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){body{background:#1B1730;color:#F2EEFF}}
.b{display:grid;justify-items:center;gap:16px}
i{width:72px;height:72px;border-radius:22px;background:#FFD23F;border:3px solid #17142B;box-shadow:5px 5px 0 #17142B;display:grid;place-items:center;font:800 34px system-ui;font-style:normal;color:#17142B;animation:b 1.1s ease-in-out infinite}
@keyframes b{50%{transform:translate(-2px,-4px);box-shadow:7px 9px 0 #17142B}}
@media (prefers-reduced-motion:reduce){i{animation:none}}
</style></head><body><div class="b"><i>⇄</i><span>Starting Tandemi…</span></div></body></html>
